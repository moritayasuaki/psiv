name: Bug report
description: Report a reproducible implementation or build problem.
body:
  - type: markdown
    attributes:
      value: Use synthetic inputs and public test keys. For suspected vulnerabilities, follow SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the commit, toolchain versions, OS and a minimal example.
    validations:
      required: true
