[package]
name = "psiv"
version = "0.5.0-experimental"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/moritayasuaki/psiv"
description = "Experimental reusable PSIV encryption with a separate Lean specification"
readme = "README.md"

[dependencies]
poly1305 = { version = "=0.8.0", default-features = false, features = ["zeroize"] }
subtle = { version = "=2.6.1", default-features = false }
zeroize = { version = "=1.9.0", default-features = false }

[dev-dependencies]
serde_json = "=1.0.151"
